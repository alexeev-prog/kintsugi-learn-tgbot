[project]
name = "kintsugi-learn-tgbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexeev Bronislav", email = "alexeev.dev@mail.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.24.0",
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "certifi>=2026.1.4",
    "gtts>=2.5.4",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "sqlalchemy>=2.0.45",
    "tomli>=2.4.0",
]

[project.scripts]
kintsugi-learn-tgbot = "kintsugi_learn_tgbot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
